// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '36.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '26')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '36')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '36')

        // Alias without "Version" suffix for AGP 8.x compatibility
        compileSdk = compileSdkVersion
        minSdk = minSdkVersion
        targetSdk = targetSdkVersion

        kotlinVersion = findProperty('android.kotlinVersion') ?: '2.1.20'
        kspVersion = findProperty('kspVersion') ?: '2.1.20-2.0.1'
        ndkVersion = "28.0.13004108"
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.3.15")
    }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        maven {
            // React Native Android binaries
            url(new File(providers.exec {
                workingDir(rootDir)
                commandLine("node", "--print", "require.resolve('react-native/package.json')")
            }.standardOutput.asText.get().trim(), '../android'))
        }
    }
}

// Force certain versions across all subprojects to avoid conflicts
subprojects {
    project.configurations.all {
        resolutionStrategy {
            force 'com.google.android.gms:play-services-measurement-impl:21.5.0'
            force 'com.google.android.gms:play-services-measurement-api:21.5.0'
            // FORCE 16KB ALIGNED VERSIONS OF GIF/AVIF DECODERS
            force 'com.github.penfeizhou.android.animation:gif:3.0.5'
            force 'com.github.penfeizhou.android.animation:avif:3.0.5'
            force 'com.github.penfeizhou.android.animation:glide-plugin:3.0.5'
        }
    }

    plugins.withId('org.jetbrains.kotlin.android') {
        if (project.name == 'app' || project.name.startsWith('expo')) {
            apply plugin: 'org.jetbrains.kotlin.plugin.compose'
        }
    }
}