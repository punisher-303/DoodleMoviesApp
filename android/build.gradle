// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '26')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '35')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '2.0.21'

        ndkVersion = "28.0.13004108"
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }

     dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.3.15")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Optional: For Kotlin projects
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        maven {
            // React Native Android binaries
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC binaries
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }
    }
    // AUTO-APPLY COMPOSE COMPILER PLUGIN TO EXPO AND APP IF NEEDED
    subprojects {
        plugins.withId('org.jetbrains.kotlin.android') {
            if (project.name == 'app' || project.name.startsWith('expo')) {
                apply plugin: 'org.jetbrains.kotlin.plugin.compose'
            }
        }
    }
}

// Optional: Force certain versions to avoid conflicts
subprojects {
    project.configurations.all {
        resolutionStrategy {
            force 'com.google.android.gms:play-services-measurement-impl:21.5.0'
            force 'com.google.android.gms:play-services-measurement-api:21.5.0'
            // FORCE 16KB ALIGNED VERSIONS OF GIF/AVIF DECODERS
            force 'com.github.penfeizhou.android.animation:gif:3.0.5'
            force 'com.github.penfeizhou.android.animation:avif:3.0.5'
            force 'com.github.penfeizhou.android.animation:glide-plugin:3.0.5'
        }
    }
}